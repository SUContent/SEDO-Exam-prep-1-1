<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Calculator Tests</title>
  <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.19.4.css">
</head>

<body>
  <div id="qunit"></div>

  <div id="qunit-fixture">
    <input id="a" type="number" step="any">
    <input id="b" type="number" step="any">
    <button id="btn-add">Add</button>
    <button id="btn-subtract">Subtract</button>
    <button id="btn-multiply">Multiply</button>
    <div id="result"></div>
  </div>

  <script src="https://code.jquery.com/qunit/qunit-2.19.4.js"></script>
  <script src="script.js"></script>

  <script>
    QUnit.module('Calculator functions', {
      beforeEach() {
        bindCalculatorEvents();
      }
    });

    QUnit.test('add()', assert => {
      assert.equal(add(2, 3), 5, '2 + 3 = 5');
      assert.equal(add(-1, 1), 0, '-1 + 1 = 0');
    });

    QUnit.test('subtract()', assert => {
      assert.equal(subtract(5, 3), 2, '5 - 3 = 2');
      assert.equal(subtract(0, 4), -4, '0 - 4 = -4');
    });

    QUnit.test('multiply()', assert => {
      assert.equal(multiply(2, 3), 6, '2 * 3 = 6');
      assert.equal(multiply(-2, 3), -6, '-2 * 3 = -6');
      assert.equal(multiply(2.5, 2), 5, '2.5 * 2 = 5');
    });

    QUnit.test('subtract input validation', assert => {
      const inputA = document.getElementById('a');
      const inputB = document.getElementById('b');
      const button = document.getElementById('btn-subtract');
      const result = document.getElementById('result');

      const cases = [
        ['', '', 'Please fill both inputs', 'Both inputs empty'],
        ['', '3', 'Please fill both inputs', 'First input empty'],
        ['5', '', 'Please fill both inputs', 'Second input empty'],
        ['5', '3', '2', 'Valid subtraction'],
        ['0', '3', '-3', 'Zero is a valid input']
      ];

      cases.forEach(([a, b, expected, message]) => {
        inputA.value = a;
        inputB.value = b;
        button.click();

        assert.equal(result.textContent, expected, message);
      });
    });

    QUnit.test('calculator button handlers', assert => {
      document.getElementById('a').value = '5';
      document.getElementById('b').value = '3';

      const result = document.getElementById('result');

      document.getElementById('btn-add').click();
      assert.equal(result.textContent, '8', 'Add button works');

      document.getElementById('btn-subtract').click();
      assert.equal(result.textContent, '2', 'Subtract button works');

      document.getElementById('btn-multiply').click();
      assert.equal(result.textContent, '15', 'Multiply button works');
    });

  </script>
</body>

</html>
